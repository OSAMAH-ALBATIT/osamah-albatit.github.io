<style>
:root{
  --bg:#FBF8F6; --surface:#FFFFFF; --surface-2:#F3ECEA; --text:#451D29; --muted:#5E4950;
  --line:#EADFDD; --brand:#451D29; --accent:#682B3B; --accent-soft:#F3E7E9; --gold:#245B60; --accent-2:#925064;
  --shadow:0 10px 30px rgba(69,29,41,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#122F33; --surface:#18393D; --surface-2:#1F4A4F; --text:#DCE8E5; --muted:#A9C3C0;
    --line:rgba(220,232,229,.14); --brand:#DCE8E5; --accent:#C98A9C; --accent-soft:rgba(146,80,100,.2); --gold:#A9D3CF; --accent-2:#925064;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#122F33; --surface:#18393D; --surface-2:#1F4A4F; --text:#DCE8E5; --muted:#A9C3C0;
  --line:rgba(220,232,229,.14); --brand:#DCE8E5; --accent:#C98A9C; --accent-soft:rgba(146,80,100,.2); --gold:#A9D3CF; --accent-2:#925064;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Tajawal','Inter',system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
html[lang="en"] body{font-family:'Inter','Tajawal',system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800}
.logo img{width:40px;height:40px;object-fit:contain;padding:4px;border-radius:10px;background:#fff;border:1px solid var(--line)}
nav{display:flex;gap:4px;margin-inline-start:auto}
nav a{padding:6px 12px;border-radius:8px;font-size:15px;color:var(--muted);transition:.2s}
nav a:hover,nav a.on{color:var(--text);background:var(--surface-2)}
.tools{display:flex;gap:6px}
.btn-ic{height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font:600 13px Inter,Tajawal;display:grid;place-items:center}
.btn-ic:hover{border-color:var(--accent)}
.btn-ic svg{width:18px;height:18px}

/* hero */
.hero{padding:64px 0 40px}
.hero .wrap{display:grid;grid-template-columns:300px 1fr;gap:48px;align-items:center}
.ph{position:relative;width:300px;aspect-ratio:1/1}
.ph::before{content:"";position:absolute;inset:18px -18px -18px 18px;border-radius:28px;border:2px solid var(--accent);opacity:.6}
html[dir="rtl"] .ph::before{inset:18px 18px -18px -18px}
.ph img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:28px;box-shadow:var(--shadow);background:var(--surface-2)}
.badge{position:absolute;bottom:18px;inset-inline-start:-14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:8px 12px;font-size:13px;display:flex;align-items:center;gap:8px}
.badge b{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2)}
.kicker{color:var(--accent);font-weight:700;font-size:15px;letter-spacing:.3px}
h1{font-size:clamp(34px,5vw,54px);line-height:1.15;margin:8px 0 10px;font-weight:800}
.role{font-size:20px;color:var(--muted);min-height:34px}
.role span{color:var(--text);font-weight:700;border-inline-end:2px solid var(--accent);padding-inline-end:4px}
.lead{margin:18px 0 26px;max-width:600px;color:var(--muted);font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit;transition:.2s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn svg{width:18px;height:18px}
.stats{display:flex;gap:28px;margin-top:30px;flex-wrap:wrap}
.stats div{font-size:13px;color:var(--muted)}
.stats strong{display:block;font:800 28px Inter;color:var(--text)}

/* sections */
section.s{padding:56px 0;scroll-margin-top:70px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sh h2{font-size:30px;font-weight:800}
.sh h2::after{content:"";display:block;width:44px;height:4px;border-radius:4px;background:var(--accent);margin-top:8px}
.sh p{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}

/* about */
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.about p{color:var(--muted);font-size:16.5px}
.facts{display:grid;gap:12px}
.fact{display:flex;gap:12px;align-items:center}
.fact span{width:38px;height:38px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.fact span svg{width:19px;height:19px}
.fact small{display:block;color:var(--muted);font-size:12.5px}
.fact b{font-size:15px}

/* timeline */
.tl{position:relative;display:grid;gap:16px;padding-inline-start:26px}
.tl::before{content:"";position:absolute;inset-inline-start:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--accent),var(--line))}
.tl .card{position:relative;cursor:pointer;transition:.25s}
.tl .card::before{content:"";position:absolute;inset-inline-start:-26px;top:26px;width:16px;height:16px;border-radius:50%;background:linear-gradient(145deg,#682B3B,#925064);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
.tl .card:hover{border-color:var(--accent);box-shadow:0 18px 36px -18px color-mix(in srgb,var(--accent) 45%,transparent)}
.tl-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.tl h3{font-size:19px}
.tl .where{color:var(--accent);font-weight:700}
.tl .when{font-size:13px;color:var(--muted);background:var(--surface-2);padding:2px 10px;border-radius:20px}
.tl ul{margin-top:12px;padding-inline-start:18px;color:var(--muted);display:none}
.tl .card.open ul{display:block}
.tl li{margin:4px 0}
.tg{margin-top:14px;display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:30px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:.2s;animation:ping 2.4s ease-out infinite}
.tg:hover{background:var(--accent);color:#fff}
.tg svg{width:16px;height:16px;transition:transform .3s}
.tg .l{display:none}
.tl .card.open .tg{animation:none;background:transparent;border-color:var(--line);color:var(--muted)}
.tl .card.open .tg .m{display:none}.tl .card.open .tg .l{display:inline}
.tl .card.open .tg svg{transform:rotate(180deg)}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tl ul{animation:drop .35s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.more{font-size:13px;color:var(--muted);margin-top:6px}

/* skills */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:30px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit;font-weight:600;font-size:14px}
.tab.on{background:var(--brand);border-color:var(--brand);color:var(--bg)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sk{display:flex;gap:14px;align-items:flex-start;transition:opacity .25s,transform .25s}
.sk.hide{display:none}
.sk .ic{width:46px;height:46px;flex:none;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.sk .ic svg{width:22px;height:22px}
.sk h4{font-size:16px}
.sk p{font-size:13.5px;color:var(--muted);line-height:1.6}

/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.projects{grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:20px}
.pj{min-width:0}
.pj{--g1:#451D29;--g2:#682B3B;--glow:#925064;position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:12px;min-height:270px;padding:26px;border:0;border-radius:24px;color:#fff;
  background:radial-gradient(100% 80% at var(--mx,85%) var(--my,0%),color-mix(in srgb,var(--glow) 28%,transparent),transparent 60%),linear-gradient(150deg,var(--g1) 0%,var(--g2) 100%);
  box-shadow:0 18px 40px -18px color-mix(in srgb,var(--g1) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.pj::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(150deg,rgba(255,255,255,.55),rgba(255,255,255,.05) 40%,rgba(255,255,255,.25));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.pj::after{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:26px 26px;-webkit-mask:radial-gradient(80% 70% at 100% 0%,#000,transparent 70%);mask:radial-gradient(80% 70% at 100% 0%,#000,transparent 70%)}
html[dir="rtl"] .pj::after{-webkit-mask:radial-gradient(80% 70% at 0% 0%,#000,transparent 70%);mask:radial-gradient(80% 70% at 0% 0%,#000,transparent 70%)}
.pj:hover{transform:translateY(-6px);box-shadow:0 28px 50px -18px color-mix(in srgb,var(--g1) 90%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.pj.g1{--g1:#2B111A;--g2:#451D29;--glow:#682B3B}
.pj.g2{--g1:#183F43;--g2:#245B60;--glow:#6D9293}
.pj.g3{--g1:#451D29;--g2:#925064;--glow:#B47888}
.pj.g4{--g1:#245B60;--g2:#6D9293;--glow:#DCE8E5}
.pj.feat{grid-column:span 2;min-height:300px;--g1:#2B111A;--g2:#451D29;--glow:#925064}
.pj.feat h3{font-size:26px}
.pj.feat p{font-size:16px;max-width:620px}
.pj .wm{position:absolute;bottom:-26px;inset-inline-end:-18px;width:150px;height:150px;opacity:.12;z-index:-1;transform:rotate(-12deg);transition:transform .5s,opacity .5s}
.pj .wm svg{width:100%;height:100%;stroke-width:1.4}
.pj:hover .wm{transform:rotate(0) scale(1.08);opacity:.2}
.pj .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pj .num{font:800 13px Inter;letter-spacing:2px;opacity:.55}
.pj .cat{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:30px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.pj .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.28);box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.pj .ico svg{width:22px;height:22px}
.pj h3{font-size:20px;line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,.2)}
.pj p{color:rgba(255,255,255,.82);font-size:14.5px;flex:1}
.pj .bot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pj .visit{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800;color:var(--g1);padding:8px 16px;border-radius:30px;background:#fff;box-shadow:0 6px 18px -6px rgba(0,0,0,.45);transition:.25s}
.pj .visit:hover{transform:translateY(-2px);background:#F4ECEB;color:#451D29}
.pj .priv{font-size:12.5px;font-weight:700;color:#fff;padding:7px 13px;border-radius:30px;background:rgba(0,0,0,.18);border:1px dashed rgba(255,255,255,.4);cursor:help}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:600 11.5px Inter,Tajawal;padding:3px 10px;border-radius:30px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.16)}
.privnote{margin-top:18px;font-size:13.5px;color:var(--muted);text-align:center}

/* premium "lux" cards — same language as the project cards */
.lux{--g1:#451D29;--g2:#682B3B;--glow:#925064;position:relative;isolation:isolate;border:0!important;border-radius:24px;color:#fff;
  background:radial-gradient(100% 80% at var(--mx,85%) var(--my,0%),color-mix(in srgb,var(--glow) 26%,transparent),transparent 60%),linear-gradient(150deg,var(--g1) 0%,var(--g2) 100%);
  box-shadow:0 18px 40px -18px color-mix(in srgb,var(--g1) 80%,transparent),inset 0 0 0 1px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.lux::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:26px 26px;-webkit-mask:radial-gradient(70% 70% at 100% 0%,#000,transparent 70%);mask:radial-gradient(70% 70% at 100% 0%,#000,transparent 70%)}
html[dir="rtl"] .lux::after{-webkit-mask:radial-gradient(70% 70% at 0% 0%,#000,transparent 70%);mask:radial-gradient(70% 70% at 0% 0%,#000,transparent 70%)}
.lux:hover{transform:translateY(-5px);box-shadow:0 28px 50px -18px color-mix(in srgb,var(--g1) 90%,transparent),inset 0 0 0 1px rgba(255,255,255,.24),inset 0 1px 0 rgba(255,255,255,.32)}
.lux.g1{--g1:#2B111A;--g2:#451D29;--glow:#682B3B}
.lux.g2{--g1:#183F43;--g2:#245B60;--glow:#6D9293}
.lux.g3{--g1:#451D29;--g2:#925064;--glow:#B47888}
.lux.g4{--g1:#245B60;--g2:#6D9293;--glow:#DCE8E5}
.lux.g0{--g1:#2B111A;--g2:#451D29;--glow:#925064}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.06))!important;border:1px solid rgba(255,255,255,.28);color:#fff!important;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.lux .wm{position:absolute;bottom:-24px;inset-inline-end:-14px;width:140px;height:140px;opacity:.1;z-index:-1;transform:rotate(-12deg);transition:transform .5s,opacity .5s;pointer-events:none}
.lux .wm svg{width:100%;height:100%;stroke-width:1.3}
.lux:hover .wm{transform:rotate(0) scale(1.08);opacity:.18}
.lux .wm{overflow:hidden}
/* about */
.about .lux{overflow:hidden}
.about .lux p{color:rgba(255,255,255,.88)}
.about .lux.txt{padding:30px}
.about .lux.txt .q{font:800 64px/0.6 Georgia,serif;color:var(--glow);opacity:.8;display:block;height:28px}
.lux .fact small{color:rgba(255,255,255,.65)}
.lux .fact span{width:42px;height:42px;border-radius:12px}
.lux .fact + .fact{padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
/* experience */
.tl .lux{cursor:pointer}
.tl .lux:hover{border-color:transparent}
.tl .lux h3{color:#fff}
.tl .lux .where{color:#F0DCE1}
.tl .lux .when{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff}
.tl .lux li{color:rgba(255,255,255,.86)}
.tl .lux li::marker{color:#F0DCE1}
.tl .lux .tg{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55);color:#fff;animation-name:pingw}
.tl .lux .tg:hover{background:#fff;color:var(--g1)}
.tl .lux.open .tg{background:transparent;border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.75)}
@keyframes pingw{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
/* skills */
.sk.lux{padding:22px;min-height:130px;overflow:hidden}
.sk.lux .ic{border-radius:14px}
.sk.lux h4{color:#fff}
.sk.lux p{color:rgba(255,255,255,.8)}
/* education & languages */
.two .lux{padding:28px;overflow:hidden}
.edu.lux h3{color:#fff;font-size:21px}
.edu.lux p{color:rgba(255,255,255,.82)}
.edu.lux .ic{width:60px;height:60px;border-radius:16px}
.lang.lux .lg-row small{color:#F0DCE1;font-weight:700}
.lang.lux .meter{background:rgba(255,255,255,.14);height:9px}
.lang.lux .meter i{background:linear-gradient(90deg,#F0DCE1,#fff)!important;box-shadow:0 0 12px rgba(240,220,225,.55)}
html[dir="rtl"] .lang.lux .meter i{background:linear-gradient(270deg,#F0DCE1,#fff)!important}

/* ===== theme system: light = soft pastel, dark = dark luxe; cards, pills and buttons all read these tokens ===== */
:root{
  --cA:linear-gradient(160deg,#F5ECEB 0%,#E7D9D8 100%);
  --cB:linear-gradient(160deg,#EFF5F3 0%,#DCE8E5 100%);
  --cC:linear-gradient(160deg,#F3E9E8 0%,#ECE6E1 50%,#DCE8E5 100%);
  --cInk:#451D29; --cTitle:#451D29; --cBody:#5E4950; --cLine:1px solid rgba(255,255,255,.9);
  --cShadow:0 16px 34px -22px rgba(69,29,41,.45); --cShadowH:0 26px 46px -22px rgba(69,29,41,.5);
  --cGlow:rgba(255,255,255,.75); --cGrid:rgba(69,29,41,.05); --wmInk:#682B3B;
  --icoBg:linear-gradient(145deg,#682B3B,#925064); --icoInk:#fff;
  --pillBg:#245B60; --pillInk:#fff; --chipBg:rgba(255,255,255,.8); --chipInk:#245B60;
  --btnBg:linear-gradient(135deg,#245B60,#183F43); --btnHover:#682B3B;
  --privLine:#925064; --privInk:#682B3B; --privBg:rgba(255,255,255,.65);
  --trk:rgba(255,255,255,.8); --fill:linear-gradient(270deg,#245B60,#6D9293); --hiInk:#245B60; --num:#6D9293;
  --band:linear-gradient(120deg,#E7D9D8 0%,#F1E7E5 45%,#DCE8E5 100%); --bandInk:#451D29;
  --h2:#451D29; --h2line:linear-gradient(90deg,#245B60,#6D9293); --kick:#245B60; --role:#682B3B;
  --pri:linear-gradient(135deg,#245B60,#183F43); --dot:linear-gradient(145deg,#682B3B,#925064);
}
:root[data-theme="dark"]{
  --cA:linear-gradient(160deg,rgba(220,232,229,.09),rgba(220,232,229,.03));
  --cB:var(--cA); --cC:var(--cA);

/* main action buttons: gradient fill + rotating gradient ring + light sweep */
.pj .visit,.tl .lux .tg,.links a,.btn.pri{
  position:relative;overflow:hidden;isolation:isolate;
  border:1.5px solid transparent!important;
  background:var(--btnFill) padding-box,var(--btnRing) border-box!important;
  color:#fff!important;animation:ring 4s linear infinite!important;
  box-shadow:0 10px 22px -12px rgba(36,91,96,.75)!important;transition:transform .25s,box-shadow .25s}
.pj .visit::after,.tl .lux .tg::after,.links a::after,.btn.pri::after{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
  transform:translateX(-120%);animation:sweep 3.2s ease-in-out infinite}
.pj .visit:hover,.tl .lux .tg:hover,.links a:hover,.btn.pri:hover{transform:translateY(-2px);box-shadow:0 16px 28px -12px rgba(36,91,96,.85)!important;background:var(--btnFill) padding-box,var(--btnRing) border-box!important;color:#fff!important}
.tl .lux.open .tg{background:var(--pillFill) padding-box,var(--pillRing) border-box!important;color:var(--pillInk)!important;box-shadow:none!important}
.tl .lux.open .tg::after{display:none}
@keyframes ring{to{--ang:360deg}}
@keyframes sweep{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
/* small pills (status, category, private): soft frosted fill with a thin gradient ring */
.pj .cat,.tl .lux .when{

.tags span{background:var(--chipBg)!important;color:var(--chipInk)!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--chipInk) 18%,transparent)}
.tab.on{border:1.5px solid transparent!important;background:var(--btnFill) padding-box,var(--btnRing) border-box!important;animation:ring 4s linear infinite}
/* icon tiles get a soft inner light */
.glass,.pj .ico{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -8px rgba(69,29,41,.55)!important}
/* secondary buttons and idle tabs: frosted with a thin gradient ring */
.btn:not(.pri),.tab:not(.on),.btn-ic{border:1.5px solid transparent!important;background:var(--pillFill) padding-box,var(--pillRing) border-box!important;color:var(--pillInk)!important}

@media (prefers-reduced-motion:reduce){.pj .visit,.tl .lux .tg,.links a,.btn.pri,.tab.on{animation:none!important}.pj .visit::after,.tl .lux .tg::after,.links a::after,.btn.pri::after{display:none}}

/* ===== motion ===== */
#prog{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;z-index:50;background:linear-gradient(90deg,#682B3B,#C98A9C,#3A5A9A);box-shadow:0 0 10px rgba(201,138,156,.6)}
.hero{position:relative;overflow:hidden;isolation:isolate}
.orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;z-index:-1;pointer-events:none}
.orb.o1{width:340px;height:340px;background:#C98A9C;top:-90px;inset-inline-end:-60px;animation:float1 14s ease-in-out infinite}
.orb.o2{width:300px;height:300px;background:#3A5A9A;bottom:-120px;inset-inline-start:-40px;opacity:.35;animation:float2 17s ease-in-out infinite}
.orb.o3{width:160px;height:160px;background:#925064;top:40%;inset-inline-start:40%;opacity:.25;animation:float1 11s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,30px) scale(1.12)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-30px) scale(.9)}}
.hero h1{background:linear-gradient(90deg,var(--bandInk) 0%,var(--bandInk) 35%,#A35B71 50%,var(--bandInk) 65%,var(--bandInk) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.ph{animation:bob 6s ease-in-out infinite}
.ph::after{content:"";position:absolute;inset:-10px;border-radius:34px;padding:2px;background:conic-gradient(from var(--ang),transparent 0 55%,#C98A9C 70%,#3A5A9A 85%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ring 5s linear infinite;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.badge b{animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}100%{box-shadow:0 0 0 12px rgba(34,197,94,0)}}
.stats strong{display:block;width:max-content;margin-inline:auto;transition:transform .3s}

.stats div:hover strong{transform:scale(1.12);color:#925064}

.sh h2::after{width:0!important;transition:width .9s cubic-bezier(.2,.8,.2,1) .2s}

.rv:not(.in){transform:translateY(28px) scale(.97)}
.pj.in,.lux.in{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px))!important;transition:transform .25s ease-out,box-shadow .35s,opacity .7s}

  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  pen:'<path d="M12 19l7-7 3 3-7 7z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/><circle cx="11" cy="11" r="2"/>',
  film:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 9h5M2 15h5M17 9h5M17 15h5"/>',
  office:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
  game:'<rect x="2" y="7" width="20" height="12" rx="5"/><path d="M7 11v4M5 13h4M15 12h.01M18 14h.01"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  mail:'<path d="M4 4h16v16H4z"/><path d="m4 6 8 7 8-7"/>',
  tel:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  wa:'<path d="M3 21l1.6-4.8A9 9 0 1 1 8 19.6z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8c-1-.5-1.8-1.3-2.3-2.3l.8-1-1-2z"/>',
  in:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/>',
  gh:'<path d="M9 19c-4 1.5-4-2-6-2.5M15 21v-3.5a3 3 0 0 0-.8-2.3c2.8-.3 5.8-1.4 5.8-6.2a4.8 4.8 0 0 0-1.3-3.3 4.5 4.5 0 0 0-.1-3.3s-1-.3-3.4 1.3a11.6 11.6 0 0 0-6 0C6.8 2.1 5.8 2.4 5.8 2.4a4.5 4.5 0 0 0-.1 3.3A4.8 4.8 0 0 0 4.4 9c0 4.8 3 5.9 5.8 6.2a3 3 0 0 0-.8 2.3V21"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const $ = s => document.querySelector(s);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let lang = store.get('cv-lang') || 'ar', cat = 'all', typer;

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = lang === 'ar' ? 'أسامة محمد البتيت | مهندس برمجيات' : 'Osamah Albatit | Software Engineer';
  $('#langBtn').textContent = lang === 'ar' ? 'EN' : 'ع';
  document.querySelectorAll('[data-i]').forEach(el => { const v = t[el.dataset.i]; if (typeof v === 'string') el.textContent = v; });
  $('#photo').alt = t.name;
  $('#nav').innerHTML = t.nav.map(([id,l]) => `<a href="#${id}" data-s="${id}">${l}</a>`).join('');
  $('#stats').innerHTML = t.stats.map(([n,l]) => `<div><strong>${n}</strong>${l}</div>`).join('');
  $('#facts').innerHTML = t.facts.map(([i,l,v]) => `<div class="fact"><span class="glass">${svg(i)}</span><div><small>${l}</small><b>${v}</b></div></div>`).join('');
  $('#timeline').innerHTML = t.exp.map((e,i) => `<div class="card lux ${['g0','g3','g1','g2'][i%4]} rv"><div class="tl-h"><div><h3>${e.t}</h3><div class="where">${e.w}</div></div><span class="when">${e.d}</span></div><ul>${e.items.map(x=>`<li>${x}</li>`).join('')}</ul><button class="tg" type="button"><span class="m">${t.showMore} · ${e.items.length} ${t.tasks}</span><span class="l">${t.showLess}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button></div>`).join('');
  $('#tabs').innerHTML = Object.entries(t.cats).map(([k,l]) => `<button class="tab${k===cat?' on':''}" data-c="${k}">${l}</button>`).join('');
  $('#skillGrid').innerHTML = t.skills.map(([c,ic,h,p],i) => `<div class="card lux g${i%4+1} sk rv${cat!=='all'&&cat!==c?' hide':''}" data-c="${c}"><span class="wm">${svg(ic)}</span><div class="ic glass">${svg(ic)}</div><div><h4>${h}</h4><p>${p}</p></div></div>`).join('');
  const PI = ['layers','globe','grid','brief','chart','game','shield','film','pen'];
  $('#projGrid').innerHTML = t.projects.map(([c,h,p,tags,url],i) => `<article class="card pj rv g${i%4+1}"><span class="wm">${svg(PI[i]||'code')}</span><div class="top"><span class="ico">${svg(PI[i]||'code')}</span><span class="num">${String(i+1).padStart(2,'0')}</span></div><span class="cat">${c}</span><h3>${h}</h3><p>${p}</p><div class="bot"><div class="tags">${tags.map(x=>`<span>${x}</span>`).join('')}</div>${url==='private'?`<span class="priv" title="${t.privateTip}">🔒 ${t.private}</span>`:url?`<a class="visit" href="${url}" target="_blank" rel="noopener">${t.visit} ↗</a>`:''}</div></article>`).join('');
  $('#langs').innerHTML = t.langs.map(([n,l,v]) => `<div><div class="lg-row"><b>${n}</b><small>${l}</small></div><div class="meter"><i data-v="${v}"></i></div></div>`).join('');
  const L = [], c = CONTACT;
  if (c.email) L.push(`<a href="mailto:${c.email}">${svg('mail')}${t.lbl.email}</a>`);
  if (c.phone) L.push(`<a href="tel:${c.phone}">${svg('tel')}${t.lbl.phone}</a>`);
  if (c.whatsapp) L.push(`<a href="https://wa.me/${c.whatsapp}" target="_blank" rel="noopener">${svg('wa')}${t.lbl.whatsapp}</a>`);
  if (c.linkedin) L.push(`<a href="${c.linkedin}" target="_blank" rel="noopener">${svg('in')}${t.lbl.linkedin}</a>`);
  if (c.github) L.push(`<a href="${c.github}" target="_blank" rel="noopener">${svg('gh')}${t.lbl.github}</a>`);
  $('#links').innerHTML = L.join('') || `<span style="opacity:.6;font-size:14px">${t.noContact}</span>`;
  type(t.roles);
  observe();
}

function type(words){
  clearTimeout(typer);
  let w = 0, i = 0, del = false; const el = $('#typed');
  (function tick(){
    const s = words[w];
    el.textContent = s.slice(0, i);
    if (!del && i < s.length) i++;
    else if (!del) { del = true; return typer = setTimeout(tick, 1600); }
    else if (i > 0) i--;
    else { del = false; w = (w + 1) % words.length; }
    typer = setTimeout(tick, del ? 35 : 75);
  })();
}

let io;
function observe(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add('in');
    (e.target.matches('.stats') ? e.target.querySelectorAll('strong') : []).forEach(countUp);
    e.target.querySelectorAll('.meter i').forEach(m => m.style.width = m.dataset.v + '%');
    io.unobserve(e.target);
  }), {threshold:.12});
  document.querySelectorAll('.rv').forEach(el => {
    const sib = [...el.parentElement.children].filter(c => c.classList.contains('rv'));
    el.style.setProperty('--d', (Math.max(0, sib.indexOf(el)) % 6) * 90 + 'ms');
    io.observe(el);
  });
  // safety net: if the observer never fires (some in-app browsers), show everything
  setTimeout(() => {
    if (document.querySelector('.rv.in')) return;
    document.querySelectorAll('.rv').forEach(el => el.classList.add('in'));
    document.querySelectorAll('.meter i').forEach(m => m.style.width = m.dataset.v + '%');
  }, 2500);
}

document.addEventListener('click', e => {
  const tl = e.target.closest('.tl .card'); if (tl) tl.classList.toggle('open');
  const tab = e.target.closest('.tab');
  if (tab) {
    cat = tab.dataset.c;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b === tab));
    document.querySelectorAll('.sk').forEach(s => s.classList.toggle('hide', cat !== 'all' && s.dataset.c !== cat));
  }
});
$('#langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; store.set('cv-lang', lang); render(); };
$('#printBtn').onclick = () => window.print();
const dark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const savedTheme = store.get('cv-theme'); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$('#themeBtn').onclick = () => { const v = dark() ? 'light' : 'dark'; document.documentElement.dataset.theme = v; store.set('cv-theme', v); };
window.addEventListener('beforeprint', () => document.querySelectorAll('.meter i').forEach(m => m.style.width = m.dataset.v + '%'));

// active nav link while scrolling
const secs = ['about','experience','skills','projects','education','contact'];
addEventListener('scroll', () => {
  let cur = ''; secs.forEach(id => { const s = document.getElementById(id); if (s && s.getBoundingClientRect().top < 120) cur = id; });
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.s === cur));
}, {passive:true});

document.addEventListener('pointermove', e => { const el = e.target.closest('.pj,.lux'); if (!el) return; const r = el.getBoundingClientRect(); el.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%'); el.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%'); }, {passive:true});

// count-up for the hero numbers
function countUp(el){
  const m = el.textContent.match(/^(\D*)(\d+)(\D*)$/); if (!m || el.dataset.done) return;
  el.dataset.done = 1; const end = +m[2], t0 = performance.now(), dur = 1400;
  (function step(t){ const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = m[1] + Math.round(end * e) + m[3]; if (k < 1) requestAnimationFrame(step); })(t0);
  setTimeout(() => { el.textContent = m[1] + end + m[3]; }, dur + 300);
}
// 3D tilt on cards
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('pointermove', e => {
  if (reduce || e.pointerType === 'touch') return;
  const el = e.target.closest('.pj.in,.lux.in'); if (!el || el.closest('.tl')) return;
  const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  el.style.setProperty('--ry', (x * 8) + 'deg'); el.style.setProperty('--rx', (-y * 8) + 'deg');
}, {passive:true});
document.addEventListener('pointerout', e => { const el = e.target.closest && e.target.closest('.pj,.lux'); if (el && !el.contains(e.relatedTarget)) { el.style.setProperty('--rx','0deg'); el.style.setProperty('--ry','0deg'); } });
// scroll progress + back to top
addEventListener('scroll', () => {
  const h = document.documentElement, k = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
  $('#prog').style.width = (k * 100) + '%'; $('#toTop').classList.toggle('show', h.scrollTop > 600);
}, {passive:true});
$('#toTop').onclick = () => scrollTo({top:0, behavior:'smooth'});
$('#yr').textContent = new Date().getFullYear();
render();
</script>
</body>
